<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeşil'in Oyun Listesi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap');
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --pink:#ff2d78; --purple:#b026ff; --blue:#00d4ff;
  --dark:#0d0015; --panel:rgba(13,0,21,0.88);
  --grad:linear-gradient(135deg,var(--pink),var(--purple),var(--blue));
}
body { background:var(--dark); color:#e0c8ff; font-family:"Exo 2",sans-serif; min-height:100vh; padding-bottom:56px; }
body::before {
  content:''; position:fixed; top:0; left:0; right:0; bottom:0;
  background:radial-gradient(ellipse at 20% 50%,rgba(176,38,255,0.08) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(255,45,120,0.08) 0%,transparent 60%);
  z-index:-1; pointer-events:none;
}

/* DATE BADGES */
.date-badge { position:fixed; top:14px; left:18px; z-index:999; pointer-events:none; }
.date-badge-right { position:fixed; top:14px; right:18px; z-index:999; text-align:right; pointer-events:none; }
.date-line { font-family:"Orbitron",monospace; font-size:0.52rem; letter-spacing:1.5px; color:var(--blue); text-shadow:0 0 10px rgba(0,212,255,0.8); }
.date-line em { opacity:0.4; font-style:normal; }

/* HEADER */
header {
  background:rgba(13,0,21,0.92); padding:30px 24px 22px;
  text-align:center; border-bottom:1px solid rgba(176,38,255,0.4); position:relative;
}
header::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
  background:var(--grad); box-shadow:0 0 20px rgba(176,38,255,0.6);
}
header h1 {
  font-family:"Orbitron",sans-serif; font-size:1.8rem; font-weight:900;
  background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  filter:drop-shadow(0 0 20px rgba(176,38,255,0.5)); letter-spacing:4px; text-transform:uppercase;
}
header p { font-family:"Orbitron",sans-serif; font-size:0.6rem; color:rgba(176,38,255,0.5); letter-spacing:3px; margin-top:8px; }

/* HOME - 2 büyük kart */
.home-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:24px; padding:48px 32px; max-width:1000px; margin:0 auto;
}
.home-card {
  background:var(--panel); border:1px solid rgba(176,38,255,0.25); border-radius:20px;
  padding:48px 32px; cursor:pointer; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:16px;
  transition:all 0.25s; position:relative; overflow:hidden;
}
.home-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--grad); opacity:0; transition:opacity 0.25s;
}
.home-card:hover { transform:translateY(-8px); border-color:var(--purple); box-shadow:0 20px 60px rgba(176,38,255,0.2); }
.home-card:hover::before { opacity:1; }
.home-card .icon { font-size:4rem; filter:drop-shadow(0 0 16px rgba(176,38,255,0.6)); }
.home-card .title {
  font-family:"Orbitron",sans-serif; font-size:1.1rem; font-weight:700;
  background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  letter-spacing:3px; text-transform:uppercase;
}
.home-card .subtitle { font-size:0.8rem; color:rgba(176,38,255,0.45); letter-spacing:1px; }
.home-card .badge {
  font-family:"Orbitron",sans-serif; font-size:0.6rem;
  padding:4px 14px; border-radius:20px;
  background:rgba(176,38,255,0.1); border:1px solid rgba(176,38,255,0.3);
  color:rgba(176,38,255,0.6);
}

/* BACK BUTTON */
.back-wrap {
  padding:12px 20px;
  background:rgba(13,0,21,0.92);
  border-bottom:1px solid rgba(176,38,255,0.15);
  display:none;
}
.back-btn {
  padding:7px 18px; border-radius:20px; cursor:pointer;
  background:rgba(176,38,255,0.08); border:1px solid rgba(176,38,255,0.3);
  color:var(--blue); font-family:"Orbitron",sans-serif; font-size:0.6rem;
  letter-spacing:1px; transition:all 0.2s;
}
.back-btn:hover { background:rgba(176,38,255,0.18); }

/* TOOLBAR */
.toolbar {
  background:rgba(13,0,21,0.95); padding:10px 20px;
  position:sticky; top:0; z-index:100;
  border-bottom:1px solid rgba(176,38,255,0.2);
  display:none; gap:10px; flex-wrap:wrap; align-items:center;
  backdrop-filter:blur(10px);
}
.toolbar input, .toolbar select {
  padding:8px 16px; background:rgba(176,38,255,0.06);
  border:1px solid rgba(176,38,255,0.4); border-radius:20px;
  color:#e0c8ff; font-family:"Exo 2",sans-serif; font-size:0.85rem; outline:none;
}
.toolbar input { flex:1; min-width:180px; }
.toolbar input::placeholder { color:rgba(176,38,255,0.35); }
.toolbar input:focus, .toolbar select:focus { border-color:var(--pink); box-shadow:0 0 15px rgba(255,45,120,0.3); }
.toolbar select option { background:#0d0015; }
.count { font-family:"Orbitron",sans-serif; font-size:0.65rem; color:rgba(176,38,255,0.45); white-space:nowrap; }

/* GAME GRID */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; padding:18px; max-width:1700px; margin:0 auto; }

/* CARD */
.card {
  background:var(--panel); border-radius:12px; border:1px solid rgba(176,38,255,0.2);
  display:flex; flex-direction:column; overflow:hidden;
  transition:transform 0.2s, border-color 0.2s, box-shadow 0.2s; position:relative;
}
.card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:var(--grad); opacity:0; transition:opacity 0.2s; }
.card:hover { transform:translateY(-5px); border-color:var(--purple); box-shadow:0 10px 40px rgba(176,38,255,0.25); }
.card:hover::before { opacity:1; }
.card img { width:100%; height:110px; object-fit:cover; display:block; background:#0d0015; }
.card-body { padding:12px 14px; flex:1; display:flex; flex-direction:column; gap:6px; }
.card-top { display:flex; align-items:flex-start; gap:8px; }
.num { font-family:"Orbitron",sans-serif; font-size:0.6rem; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; min-width:30px; padding-top:2px; }
.name { font-family:"Orbitron",sans-serif; font-size:0.72rem; font-weight:700; color:#f0e0ff; line-height:1.4; flex:1; text-transform:uppercase; letter-spacing:0.5px; }
.special-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-family:"Orbitron",sans-serif; font-size:0.58rem; background:linear-gradient(135deg,rgba(255,45,120,0.2),rgba(176,38,255,0.2)); border:1px solid rgba(255,45,120,0.5); color:var(--pink); width:fit-content; }
.score-row { display:flex; align-items:center; justify-content:space-between; }
.score-pill { font-family:"Orbitron",sans-serif; font-size:0.95rem; font-weight:700; background:linear-gradient(135deg,var(--pink),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; filter:drop-shadow(0 0 6px rgba(255,45,120,0.5)); }
.metacritic { display:inline-flex; align-items:center; gap:4px; padding:4px 12px; border-radius:4px; font-family:"Orbitron",monospace; font-size:0.72rem; font-weight:700; width:fit-content; }
.mc-green  { background:rgba(54,185,54,0.15);  color:#36d399; border:1px solid rgba(54,185,54,0.35); }
.mc-yellow { background:rgba(251,191,36,0.15);  color:#fbbf24; border:1px solid rgba(251,191,36,0.35); }
.mc-red    { background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.35); }
.note { font-size:0.8rem; color:rgba(224,200,255,0.6); line-height:1.5; font-style:italic; border-top:1px solid rgba(176,38,255,0.15); padding-top:7px; }
.genre-tag { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:0.68rem; color:rgba(176,38,255,0.8); background:rgba(176,38,255,0.08); border:1px solid rgba(176,38,255,0.25); font-family:"Exo 2",sans-serif; letter-spacing:0.3px; }
.links { display:flex; gap:8px; margin-top:auto; padding-top:7px; }
.link-btn { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:20px; font-family:"Exo 2",sans-serif; font-size:0.72rem; font-weight:600; text-decoration:none; transition:all 0.15s; }
.btn-steam { background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(176,38,255,0.12)); border:1px solid rgba(0,212,255,0.35); color:var(--blue); padding:5px 12px; gap:6px; }
.btn-steam:hover { background:linear-gradient(135deg,rgba(0,212,255,0.25),rgba(176,38,255,0.25)); box-shadow:0 0 12px rgba(0,212,255,0.3); }
.btn-steam img { width:42px; height:24px; object-fit:fill; display:block; }
.btn-yt { background:linear-gradient(135deg,rgba(255,45,120,0.12),rgba(176,38,255,0.12)); border:1px solid rgba(255,45,120,0.35); color:var(--pink); }
.btn-yt:hover { background:linear-gradient(135deg,rgba(255,45,120,0.25),rgba(176,38,255,0.25)); box-shadow:0 0 12px rgba(255,45,120,0.3); }

/* KARAKTER GRID */
.char-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; padding:18px; max-width:1700px; margin:0 auto; }
.char-card {
  background:var(--panel); border-radius:12px; border:1px solid rgba(176,38,255,0.2);
  overflow:hidden; transition:transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  display:flex; flex-direction:column; text-align:center;
}
.char-card:hover { transform:translateY(-5px); border-color:var(--purple); box-shadow:0 10px 40px rgba(176,38,255,0.25); }
.char-img { width:100%; height:220px; object-fit:contain; background:#0d0015; }
.char-body { padding:12px; display:flex; flex-direction:column; gap:4px; }
.char-name { font-family:"Orbitron",sans-serif; font-size:0.75rem; font-weight:700; color:#f0e0ff; text-transform:uppercase; letter-spacing:1px; }
.char-from { font-size:0.7rem; color:rgba(176,38,255,0.5); font-style:italic; }
.favorite-badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 10px; border-radius:20px;
  font-family:"Orbitron",sans-serif; font-size:0.58rem;
  background:linear-gradient(135deg,rgba(255,45,120,0.2),rgba(176,38,255,0.2));
  border:1px solid rgba(255,45,120,0.5); color:var(--pink);
  width:fit-content; margin:0 auto;
}
.char-note { font-size:0.72rem; color:rgba(224,200,255,0.55); line-height:1.4; margin-top:4px; border-top:1px solid rgba(176,38,255,0.1); padding-top:6px; }

.empty-state { grid-column:1/-1; text-align:center; padding:80px 20px; }
.empty-state .icon { font-size:3.5rem; margin-bottom:16px; }
.empty-state h2 { font-family:"Orbitron",sans-serif; font-size:1.2rem; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:10px; letter-spacing:3px; }
.empty-state p { font-size:0.85rem; color:rgba(176,38,255,0.4); }

footer {
  text-align:center; padding:16px; border-top:1px solid rgba(176,38,255,0.15);
  background:rgba(13,0,21,0.9); font-family:"Orbitron",sans-serif;
  font-size:0.6rem; color:rgba(176,38,255,0.3); letter-spacing:2px;
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  backdrop-filter:blur(10px);
}
footer span { background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
footer a { color:var(--blue); text-decoration:none; }
</style>
</head>

  { id:14, name:"Watch Dogs",                           appId:243470,  special:true,  genre:"Açık Dünya · Aksiyon", note:"Her şeyi hackleyebileceğin bir Chicago — konsept olarak harikaydı ve hâlâ öyle hissettiriyor. Aiden Pierce tartışmalı bir karakter olsa da şehrin dijital ağıyla oynamak gerçekten eğlenceliydi. Bu seriyi ilk oyundan beri takip ediyorum.", steam:"https://store.steampowered.com/app/243470/" },
  { id:15, name:"Watch Dogs 2",                         appId:447040,  special:false, genre:"Açık Dünya · Aksiyon", note:"Marcus Holloway ile San Francisco'da DedSec'in hacktivist mücadelesi çok daha canlı ve renkli bir deneyim sundu. Drone ve RC araç mekaniği gameplay'e yaratıcılık kattı.", steam:"https://store.steampowered.com/app/447040/" },
  { id:16, name:"The Witcher 3: Wild Hunt",             appId:292030,  special:false, genre:"Açık Dünya · Aksiyon-RPG", note:"Oyun tarihinin başyapıtlarından biri. Geralt'ın Ciri'yi arayışı, yan görevlerin bile epik hikayeler sunması, Skellige'nin o ihtişamlı atmosferi... Her köşesinde sizi bekleyen bir şey var. Kart oyunu Gwent'e saatler harcadım.", steam:"https://store.steampowered.com/app/292030/" },
  { id:17, name:"Ghostrunner",                          appId:1139900, special:false, genre:"FPS · Siber Punk · Aksiyon", note:"Tek vuruşta öldür ya da öl. Bu minimalist kural üzerine kurulu inanılmaz hızlı bir siber punk aksiyon oyunu. Her ölüm seni sinir etmiyor, aksine 'bir kez daha' dedirtiyor. Ritmi yakaladığında kendinizi bir ninja gibi hissediyorsunuz.", steam:"https://store.steampowered.com/app/1139900/" },
  { id:18, name:"Heavy Rain",                           appId:960910,  special:false, genre:"İnteraktif Drama · Gerilim", note:"Ethan Mars'ın kaybolan oğlu için yaptıkları, Quantic Dream'in en duygusal hikayelerinden birini oluşturuyor. Her kararın sonuçları olan bu interaktif deneyim, oynayıp bitirdikten sonra size bir süre sessizlik bırakıyor.", steam:"https://store.steampowered.com/app/960910/" },
  { id:19, name:"Battlefield 1",                        appId:1238840, special:false, genre:"FPS · Savaş", note:"Birinci Dünya Savaşı'nı hiçbir oyunun yapamadığı kadar iyi anlattı. Prologue'daki 've düştü' anı oyun tarihinin en etkileyici sahnelerinden. Multiplayer'daki kaos ve ölçek benzersiz.", steam:"https://store.steampowered.com/app/1238840/" },
  { id:20, name:"Battlefield 3",                        appId:1238820, special:false, genre:"FPS · Modern Savaş", note:"Modern savaş FPS'lerinin dorukta olduğu dönemde çıktı ve CoD'a güçlü bir alternatif sundu. Frostbite motorunun yıkılabilir çevre mekaniği gerçekten devrim niteliğindeydi.", steam:"https://store.steampowered.com/app/1238820/" },
  { id:21, name:"Battlefield 4",                        appId:1238810, special:false, genre:"FPS · Modern Savaş", note:"Açılışta teknede çalan o müzik, Levolution sistemiyle çöken gökdelenler, dinamik haritalar... BF4 çıkışta sorunluydu ama yamanlar sonrası serinin en iyi multiplayer deneyimlerinden birine dönüştü.", steam:"https://store.steampowered.com/app/1238810/" },
  { id:22, name:"Battlefield: Bad Company 2",        appId:24960,   special:false, genre:"FPS · Modern Savaş", note:"Frostbite motorunun Destruction 2.0 sistemiyle tanıştığımız oyun. Bütün bir binanın çöküşünü izlemek o dönem için inanılmazdı. B Company'nin deli dolu kadrosu da hikayeye bambaşka bir renk kattı.", steam:"https://store.steampowered.com/app/24960/" },
  { id:23, name:"Battlefield Hardline",                 appId:1238880, special:false, customImg:"https://cdn.cloudflare.steamstatic.com/steam/apps/1238880/header.jpg", genre:"FPS · Polisiye", note:"Savaş alanını polisiye bir ortama taşıyan cesur bir deney. Cops vs Criminals formatı multiplayer'a taze bir boyut kattı; arabalı kovalamacalar ve banka soygunları farklı bir Battlefield hissi yarattı.", steam:"https://store.steampowered.com/app/1238830/" },
];

let page = "home"; // home | games | chars

function goHome() {
  page = "home";
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = '';
  render();
}

function render() {
  const main    = document.getElementById('mainContent');
  const toolbar = document.getElementById('toolbar');
  const backWrap = document.getElementById('backWrap');

  toolbar.style.display  = page === 'games' ? 'flex' : 'none';
  backWrap.style.display = page === 'home' ? 'none' : 'block';
  const charToolbar = document.getElementById('charToolbar');
  if (charToolbar) charToolbar.style.display = page === 'chars' ? 'flex' : 'none';

  if (page === 'home') renderHome(main);
  else if (page === 'games') renderGames(main);
}

function renderHome(main) {
  document.getElementById('totalCount').textContent = GAMES.length;
  main.innerHTML = `
    <div class="home-grid">
      <div class="home-card" onclick="page='games';render()">
        <div class="icon">🎮</div>
        <div class="title">Oyun İncelemeleri</div>
        <div class="subtitle">Kişisel oyun değerlendirmeleri</div>
        <div class="badge">${GAMES.length} oyun</div>
      </div>
    </div>`;
}

function renderGames(main) {
  const q      = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  main.innerHTML = '';
  const grid = document.createElement('div'); grid.className = 'grid';

  const filtered = GAMES.filter(g => {
    if (!g.name.toLowerCase().includes(q)) return false;
    if (status === 'special' && !g.special) return false;
    return true;
  });

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🎮</div><h2>Oyun Bulunamadı</h2><p>Arama kriterlerine uygun oyun yok.</p></div>`;
    main.appendChild(grid); return;
  }

  filtered.forEach(g => {
    const imgUrl   = g.customImg || `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appId}/header.jpg`;
    const steamUrl = g.steam || `https://store.steampowered.com/app/${g.appId}/`;
    const scoreHtml = g.score ? `<div class="score-row"><span style="font-family:'Orbitron',sans-serif;font-size:0.68rem;color:rgba(176,38,255,0.6);">Benim Puanım</span><span class="score-pill">${g.score}<span style="opacity:0.5;font-size:0.55rem">/10</span></span></div>` : '';
    const noteHtml  = g.note ? `<div class="note">${g.note}</div>` : '';
    const specialHtml = g.special ? `<div class="special-badge">💜 ÖZEL</div>` : '';
    const genreHtml = g.genre ? `<div class="genre-tag">${g.genre}</div>` : '';
    const ytBtn = g.youtube ? `<a class="link-btn btn-yt" href="${g.youtube}" target="_blank">▶ Video</a>` : '';
    let mcHtml = '';
    if (g.metacritic) {
      const mc = parseInt(g.metacritic);
      const cls = mc>=75?'mc-green':mc>=50?'mc-yellow':'mc-red';
      mcHtml = `<div class="metacritic ${cls}">Metacritic ${g.metacritic}</div>`;
    }
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `
      <img src="${imgUrl}" alt="${g.name}" loading="lazy" onerror="this.style.height='40px'" />
      <div class="card-body">
        <div class="card-top">
          <span class="num">#${String(g.id).padStart(3,'0')}</span>
          <span class="name">${g.name}</span>
        </div>
        ${specialHtml}${scoreHtml}${mcHtml}${noteHtml}
        <div class="links">
          <a class="link-btn btn-steam" href="${steamUrl}" target="_blank"><img src="${STEAM_LOGO}" /> Steam</a>
          ${genreHtml}${ytBtn}
        </div>
      </div>`;
    grid.appendChild(card);
  });

  main.appendChild(grid);
  document.getElementById('countBadge').textContent = filtered.length + ' oyun';
  document.getElementById('totalCount').textContent = GAMES.length;
}

render();
</script>
</body>
</html>
